name: Apply runtime config JSONB patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch managed server runtime_config
        shell: python
        run: |
          from pathlib import Path

          p = Path("artifacts/api-server/src/lib/state.ts")
          text = p.read_text()

          old = '''      await sql`\n        UPDATE managed_servers\n        SET runtime_config = jsonb_set(\n              COALESCE(runtime_config, '{}'::jsonb),\n              '{settings}',\n              ${JSON.stringify(defaultServerSettings)}::jsonb,\n              TRUE\n            ),\n            updated_at = NOW()\n        WHERE runtime_config IS NULL OR runtime_config->'settings' IS NULL\n      `;'''

          new = '''      await sql`\n        UPDATE managed_servers\n        SET runtime_config = CASE\n              WHEN runtime_config IS NULL THEN jsonb_build_object(\n                'settings',\n                ${JSON.stringify(defaultServerSettings)}::jsonb\n              )\n              WHEN jsonb_typeof(runtime_config) = 'object' THEN jsonb_set(\n                runtime_config,\n                '{settings}',\n                ${JSON.stringify(defaultServerSettings)}::jsonb,\n                TRUE\n              )\n              ELSE runtime_config\n            END,\n            updated_at = NOW()\n        WHERE runtime_config IS NULL OR runtime_config->'settings' IS NULL\n      `;'''

          if old not in text:
              raise SystemExit("expected managed_servers runtime_config block was not found; refusing blind edit")

          p.write_text(text.replace(old, new, 1))

      - name: Verify typecheck
        run: |
          corepack prepare pnpm@10.25.0 --activate
          unset npm_config_user_agent
          pnpm install
          pnpm -w run typecheck:libs
          pnpm --filter @workspace/api-server typecheck

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/state.ts
          git rm .github/workflows/patch-runtime-config-jsonb.yml
          git commit -m "fix: guard managed server runtime config JSONB"
          git push
