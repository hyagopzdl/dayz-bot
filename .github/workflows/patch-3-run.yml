name: Patch 3 execution

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "artifacts/api-server/src/lib/state.ts",
              '''UPDATE managed_servers
        SET runtime_config = jsonb_set(
          COALESCE(runtime_config, '{}'::jsonb),
          '{settings}',
          ${JSON.stringify(defaultServerSettings)}::jsonb,
          TRUE
        ),
        updated_at = NOW()
        WHERE runtime_config IS NULL OR runtime_config->'settings' IS NULL''',
              '''UPDATE managed_servers
        SET runtime_config = CASE
          WHEN runtime_config IS NULL THEN jsonb_build_object(
            'settings', ${JSON.stringify(defaultServerSettings)}::jsonb
          )
          WHEN jsonb_typeof(runtime_config) = 'object' THEN jsonb_set(
            runtime_config,
            '{settings}',
            ${JSON.stringify(defaultServerSettings)}::jsonb,
            TRUE
          )
          ELSE runtime_config
        END,
        updated_at = NOW()
        WHERE runtime_config IS NULL
           OR (jsonb_typeof(runtime_config) = 'object' AND runtime_config->'settings' IS NULL)'''
          )

          replace_once(
              "artifacts/api-server/src/lib/serverRegistry.ts",
              '  const server = getManagedServerById(serverId) || (serverId === getPrimaryServerId() ? getPrimaryServerDescriptor() : undefined);',
              '  const server = getManagedServerById(serverId);'
          )

          p = Path("artifacts/api-server/src/lib/serverRegistry.ts")
          text = p.read_text()
          text2 = re.sub(
              r'secretsStoredInRegistry:\s*false',
              'secretsStoredInRegistry: persistedServers.some((server) => Boolean(server.runtime.nitradoApiTokenEncrypted?.encryptedSecret || server.runtime.nitradoFtp?.passwordEncrypted?.encryptedSecret))',
              text,
              count=1,
          )
          if text2 == text:
              raise SystemExit("missing secretsStoredInRegistry diagnostic")
          p.write_text(text2)

          subprocess.run(["pnpm", "--filter", "@workspace/api-server", "typecheck"], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "rm", ".github/workflows/patch-3-run.yml"], check=True)
          subprocess.run(["git", "add", "artifacts/api-server/src/lib/state.ts", "artifacts/api-server/src/lib/serverRegistry.ts"], check=True)
          subprocess.run(["git", "commit", "-m", "fix: harden managed server registry"], check=True)
          subprocess.run(["git", "push", "origin", "main"], check=True)
          PY
