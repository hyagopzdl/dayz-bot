name: Cleanup tenant fallbacks
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'chore: remove tenant fallback cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy tenant fallbacks
        shell: python
        run: |
          from pathlib import Path
          import re

          registry = Path('artifacts/api-server/src/lib/serverRegistry.ts')
          s = registry.read_text()
          s = re.sub(r'\n\s*/\*\* @deprecated Transitional read-only bridge for old persisted rows\. New code must not use it\. \*/\n\s*primary\?: boolean;', '', s)
          s = re.sub(r'\n\s*/\*\* @deprecated Transitional bridge while the persistence migration is completed\. \*/\n\s*primarySeeded\?: boolean;', '', s)
          s = re.sub(r'\n/\*\* Transitional bootstrap bridge used only by the legacy state migration\.[\s\S]*?\n}\n\nexport function listManagedServers', '\nexport function listManagedServers', s)
          s = re.sub(r'^\s*primary:\s*(?:true|false),\n', '', s, flags=re.MULTILINE)
          registry.write_text(s)

          state = Path('artifacts/api-server/src/lib/state.ts')
          s = state.read_text()
          s = s.replace('  getPrimaryServerDescriptor,\n  getPrimaryServerId,\n', '')
          s = s.replace('const LEGACY_FILE = path.resolve(process.cwd(), "state.json");\n', '')
          s = re.sub(r'function getLocalStateFile\(\) \{[\s\S]*?\n}\n\ntype StateDomainName', 'function getLocalStateFile() {\n  return getServerStateStoragePath(getActiveServerId());\n}\n\ntype StateDomainName', s, count=1)

          # Registry hydration must never manufacture a server when the database is empty.
          s = s.replace('function mapManagedServerRow(row: any, primary: ManagedServerDescriptor): ManagedServerDescriptor {', 'function mapManagedServerRow(row: any): ManagedServerDescriptor {')
          s = s.replace('  const isPrimary = id === primary.id;\n', '  const isPrimary = false;\n')
          s = s.replace('    primary: isPrimary,\n', '')
          s = s.replace('    runtimeEnabled: isPrimary ? true : Boolean(row.runtime_enabled),', '    runtimeEnabled: Boolean(row.runtime_enabled),')
          s = s.replace('    onboardingStatus: isPrimary ? "active" : "draft",', '    onboardingStatus: "draft",')
          s = s.replace('(isPrimary ? primary.runtime.nitradoBaseDir : "")', '""')
          s = s.replace('(isPrimary ? primary.runtime.settings || {} : {})', '{}')
          s = s.replace('        ? { ...(primary.runtime.discord || {}), ...(runtimeConfig?.discord || {}) }\n        : { ...(runtimeConfig?.discord || {}) },', '        : { ...(runtimeConfig?.discord || {}) },')
          s = s.replace('      discord: isPrimary\n        ? { ...(primary.runtime.discord || {}), ...(runtimeConfig?.discord || {}) }\n        : { ...(runtimeConfig?.discord || {}) },', '      discord: { ...(runtimeConfig?.discord || {}) },')

          s = re.sub(r'async function reloadManagedServerRegistryFromDb\(primary = getPrimaryServerDescriptor\(\)\) \{', 'async function reloadManagedServerRegistryFromDb() {', s)
          s = s.replace('  if (!sql) return [primary];', '  if (!sql) return [];')
          s = s.replace('SELECT id, name, organization_id, enabled, primary_server, runtime_enabled, onboarding_status,', 'SELECT id, name, organization_id, enabled, runtime_enabled, onboarding_status,')
          s = s.replace('    ORDER BY primary_server DESC, created_at ASC, id ASC', '    ORDER BY created_at ASC, id ASC')
          s = s.replace('const descriptors = (rows as any[]).map((row) => mapManagedServerRow(row, primary));', 'const descriptors = (rows as any[]).map((row) => mapManagedServerRow(row));')
          s = s.replace('const next = descriptors.length ? descriptors : [primary];', 'const next = descriptors;')

          # Never seed a synthetic server during registry initialization.
          s = re.sub(r'\n\s*const primary = getPrimaryServerDescriptor\(\);', '', s, count=1)
          s = re.sub(r'\n\s*const inserted = await sql`\n\s*INSERT INTO managed_servers \(\n\s*id, name, organization_id, enabled, primary_server, runtime_enabled, onboarding_status, mode, nitrado_service_id, discord_guild_id, runtime_config, created_at, updated_at\n\s*\)\n\s*VALUES \(\n\s*\$\{primary\.id\}, \$\{primary\.name\}, \$\{defaultOrganization\.id\}, TRUE, TRUE, TRUE, \'active\', \$\{primary\.mode\},\n\s*\$\{primary\.integrations\.nitradoServiceId \|\| null\}, \$\{primary\.integrations\.discordGuildId \|\| null\}, \$\{JSON\.stringify\(primary\.runtime\)\}::jsonb, NOW\(\), NOW\(\)\n\s*\)\n\s*ON CONFLICT \(id\) DO NOTHING\n\s*RETURNING id\n\s*`;\n', '\n', s, count=1)
          s = re.sub(r'\n\s*const runtimeBackfill = await sql`[\s\S]*?\n\s*`;\n', '\n', s, count=1)
          s = s.replace('if ((inserted as any[]).length || (runtimeBackfill as any[]).length) {', 'if (ownershipBackfill.length) {')
          s = s.replace('operation: (inserted as any[]).length ? "seed_primary_server_metadata" : "backfill_primary_runtime_config",', 'operation: "backfill_server_ownership",')
          s = re.sub(r'bytes: Buffer\.byteLength\(JSON\.stringify\(primary\), "utf8"\),', 'bytes: Buffer.byteLength(JSON.stringify({ ownershipBackfill: (ownershipBackfill as any[]).length }), "utf8"),', s)

          # Remove primary-specific guards from server CRUD. Existence in the registry is the only authority.
          s = re.sub(r'\n\s*if \(id === getPrimaryServerId\(\)\) throw new Error\([^\n]+\);', '', s)
          s = re.sub(r'\n\s*if \(!id \|\| id === getPrimaryServerId\(\)\) throw new Error\([^\n]+\);', '\n  if (!id) throw new Error("Server ID invalido.");', s)
          s = re.sub(r'\n\s*if \(!id \|\| id === getPrimaryServerId\(\)\) return getPrimaryServerDescriptor\(\);', '\n  if (!id) throw new Error("Server ID invalido.");', s)
          s = s.replace(' WHERE id = ${id} AND id <> ${getPrimaryServerId()}', ' WHERE id = ${id}')
          s = s.replace(' AND id <> ${getPrimaryServerId()}', '')
          s = s.replace('primary_server = FALSE,\n        ', '')
          s = s.replace('primary_server = FALSE,\n', '')
          s = s.replace('primary_server, ', '')
          s = s.replace('ORDER BY primary_server DESC, ', 'ORDER BY ')
          s = s.replace('primary_server BOOLEAN NOT NULL DEFAULT FALSE,\n          ', '')
          s = s.replace('primary_server BOOLEAN NOT NULL DEFAULT FALSE,', '')
          s = s.replace('enabled, primary_server, runtime_enabled', 'enabled, runtime_enabled')
          s = s.replace('TRUE, FALSE, FALSE,', 'TRUE, FALSE,')

          # Do not auto-assign old unscoped player/position rows to an invented server.
          s = re.sub(r'\n\s*const legacyPlayerStatsOwner = getPrimaryServerId\(\);\n\s*await sql`UPDATE player_stats_state SET server_id = \$\{legacyPlayerStatsOwner\} WHERE server_id IS NULL`;', '', s)
          s = re.sub(r'\n\s*await sql`UPDATE player_position_history SET server_id = \$\{getPrimaryServerId\(\)\} WHERE server_id IS NULL`;\n', '\n', s)
          s = s.replace('    await sql`ALTER TABLE player_position_history ALTER COLUMN server_id SET NOT NULL`;\n', '')
          state.write_text(s)

          # Remove the temporary cleanup workflow itself after this commit.
          workflow = Path('.github/workflows/cleanup-tenant-fallbacks.yml')
          workflow.unlink()

      - name: Validate cleanup
        run: |
          if grep -RInE 'getPrimaryServer(Id|Descriptor)|primary_server|primary:\s*(true|false)|"bootstrap"|DEFAULT_SERVER_ID' artifacts/api-server/src/lib artifacts/api-server/src/routes 2>/dev/null; then
            echo 'Legacy tenant fallback references remain; typecheck will determine whether additional manual cleanup is required.'
          fi
          corepack prepare pnpm@10.25.0 --activate
          unset npm_config_user_agent
          pnpm install --frozen-lockfile
          pnpm -w run typecheck:libs
          pnpm --filter @workspace/api-server typecheck

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/lib/serverRegistry.ts artifacts/api-server/src/lib/state.ts .github/workflows/cleanup-tenant-fallbacks.yml
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore: remove tenant fallback cleanup workflow'
          git push
