name: Primary Reference Audit and Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply primary fallback migration
        run: python3 scripts/fix-primary-fallbacks.py
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src
          git rm -f scripts/fix-primary-fallbacks.py
          git commit -m 'fix: remove primary server fallback paths'
          git push
