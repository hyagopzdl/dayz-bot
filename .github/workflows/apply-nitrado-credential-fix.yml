name: Apply Nitrado credential fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: decouple org Nitrado credential save')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch organization credential persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('artifacts/api-server/src/lib/state.ts')
          text = path.read_text()
          old = '''export async function saveOrganizationNitradoCredential(organizationIdInput: unknown, tokenInput: unknown, metadata: Record<string, unknown> = {}) {\n  await ensurePrimaryServerRegistryMetadata();\n  if (!sql) throw new Error("Organization integration registry is unavailable.");'''
          new = '''export async function saveOrganizationNitradoCredential(organizationIdInput: unknown, tokenInput: unknown, metadata: Record<string, unknown> = {}) {\n  if (!sql) throw new Error("Organization integration registry is unavailable.");'''
          if old not in text:
              raise SystemExit('Expected saveOrganizationNitradoCredential block was not found; refusing to patch.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify patch
        run: |
          grep -A4 -n 'export async function saveOrganizationNitradoCredential' artifacts/api-server/src/lib/state.ts
          if grep -A4 -n 'export async function saveOrganizationNitradoCredential' artifacts/api-server/src/lib/state.ts | grep -q 'ensurePrimaryServerRegistryMetadata'; then
            echo 'Primary-server initialization is still present in credential save path.'
            exit 1
          fi

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/apply-nitrado-credential-fix.yml
          git add artifacts/api-server/src/lib/state.ts .github/workflows/apply-nitrado-credential-fix.yml
          git commit -m 'fix: decouple org Nitrado credential save from primary server'
          git push
