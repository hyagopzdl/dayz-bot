name: Finalize Patch 3

on:
  push:
    branches: [main]

jobs:
  finalize:
    if: github.event.head_commit.message != 'chore: finalize patch 3 workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Patch 3 hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('artifacts/api-server/src/lib/serverRegistry.ts')
          text = registry.read_text()
          old = 'const server = getManagedServerById(serverId) || (serverId === getPrimaryServerId() ? getPrimaryServerDescriptor() : undefined);'
          new = '''const server = getManagedServerById(serverId);
            if (!server) {
              throw new Error(`Servidor ${serverId} nao encontrado para resolver configuracoes.`);
            }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'Servidor ${serverId} nao encontrado para resolver configuracoes.' not in text:
              raise SystemExit('expected getServerScopedSettings fallback was not found')

          marker = 'secretsStoredInRegistry: false'
          if marker in text:
              replacement = '''secretsStoredInRegistry: persistedServers.some((server) =>
              Boolean(server.runtime.nitradoApiTokenEncrypted?.encryptedSecret)
              || Boolean(server.runtime.nitradoFtp?.passwordEncrypted?.encryptedSecret)
            )'''
              text = text.replace(marker, replacement, 1)

          registry.write_text(text)

          state = Path('artifacts/api-server/src/lib/state.ts')
          state_text = state.read_text()
          unsafe = "SET runtime_config = jsonb_set("
          if unsafe in state_text and "jsonb_typeof(runtime_config) = 'object'" not in state_text:
              raise SystemExit('unsafe scalar JSONB bootstrap still present; refusing to proceed')
          PY

      - name: Validate TypeScript
        run: pnpm --filter @workspace/api-server typecheck

      - name: Commit source changes and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/lib/serverRegistry.ts artifacts/api-server/src/lib/state.ts
          git rm .github/workflows/patch-3-finalize.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'refactor: finalize server-scoped Nitrado hardening'
          git push origin HEAD:main
