name: repair tenant startup context

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply tenant-neutral runtime repair
        shell: python
        run: |
          from pathlib import Path
          import re

          shop = Path('artifacts/api-server/src/lib/shop.ts')
          text = shop.read_text()
          text = re.sub(r'(?m)^\s*getPrimaryServerId,\n\s*getServerScopedSettings,\n', '', text, count=1)
          text = re.sub(r'function getExplicitMissionDir\(serverId: string\) \{.*?\n\}', '''function getExplicitMissionDir(serverId: string) {\n  const server = getManagedServerById(serverId);\n  return normalizeRelativePath(String(server?.runtime.settings?.dayzMissionDir || ""));\n}''', text, count=1, flags=re.S)
          text = re.sub(r'\n\s*if \(runtime\.isPrimary\) \{.*?\n\s*\}\n\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'\s*if \(readiness\.ready \|\| serverId === getPrimaryServerId\(\)\) return readiness;\n', '\n  if (readiness.ready) return readiness;\n', text, count=1)
          text = re.sub(r'\s*if \(serverId === getPrimaryServerId\(\)\) return getShopDeliveryReadiness\(serverId\);\n', '\n', text, count=1)
          text = re.sub(r'\nconst PRIMARY_SHOP_PATHS = getShopFilePaths\(getPrimaryServerId\(\)\);.*?export const SHOP_EVENT_SPAWNS_PATH = PRIMARY_SHOP_PATHS\.eventSpawnsPath;\n', '\n', text, count=1, flags=re.S)
          text = re.sub(r'(?m)^.*getPrimaryServerId.*\n', '', text)
          text = re.sub(r'(?m)^.*getServerScopedSettings.*\n', '', text)
          text = re.sub(r'(?m)^.*PRIMARY_SHOP_PATHS.*\n', '', text)
          if 'getPrimaryServerId' in text or 'getServerScopedSettings' in text or 'PRIMARY_SHOP_PATHS' in text:
              raise SystemExit('shop.ts still contains primary-specific startup dependency')
          shop.write_text(text)

          runtime = Path('artifacts/api-server/src/lib/serverRuntime.ts')
          text = runtime.read_text()
          text = re.sub(r'(?m)^\s*getPrimaryServerDescriptor,\n\s*getPrimaryServerId,\n', '', text, count=1)
          text = re.sub(r'const targetId = String\(serverId \|\| executionContext\.getStore\(\)\?\.serverId \|\| getPrimaryServerId\(\)\)\.trim\(\);.*?const staggerOffsetMs = isPrimary \? 0 : \(stableHash\(descriptor\.id\) % 10\) \* 30_000;', 'const targetId = String(serverId || executionContext.getStore()?.serverId || "").trim();\n  if (!targetId) throw new Error("TENANT_CONTEXT_REQUIRED");\n  const descriptor = getManagedServerById(targetId);\n  if (!descriptor) throw new Error(`Unknown managed server: ${targetId}`);\n\n  const staggerOffsetMs = (stableHash(descriptor.id) % 10) * 30_000;', text, count=1, flags=re.S)
          text = text.replace('    primaryLegacyAdmStoragePreserved: true,\n', '')
          text = text.replace('    ftpPrimaryGuarded: true,\n', '')
          text = text.replace('    isPrimary,\n', '    isPrimary: false,\n')
          text = re.sub(r'function getAdmStoragePaths\(descriptor: ManagedServerDescriptor\) \{.*?const root = path\.resolve\(process\.cwd\(\), "adm_servers", descriptor\.id\);', 'function getAdmStoragePaths(descriptor: ManagedServerDescriptor) {\n  const root = path.resolve(process.cwd(), "adm_servers", descriptor.id);', text, count=1, flags=re.S)
          text = re.sub(r'const descriptor = getManagedServerById\(targetId\) \|\| \(targetId === getPrimaryServerId\(\) \? getPrimaryServerDescriptor\(\) : undefined\);.*?stateFile: isPrimary\n      \? path\.resolve\(process\.cwd\(\), "state\.json"\)\n      : path\.resolve\(process\.cwd\(\), "state_servers", descriptor\.id, "state\.json"\),\n  \};', 'const descriptor = getManagedServerById(targetId);\n  if (!descriptor) throw new Error(`Unknown managed server: ${targetId}`);\n  const storage = getAdmStoragePaths(descriptor);\n  return {\n    serverId: descriptor.id,\n    isPrimary: false,\n    admLogDir: storage.logDir,\n    admManifestFile: storage.manifestFile,\n    stateFile: path.resolve(process.cwd(), "state_servers", descriptor.id, "state.json"),\n  };', text, count=1, flags=re.S)
          text = re.sub(r'export function getActiveServerId\(\) \{.*?\n\}', '''export function getActiveServerId() {\n  const active = executionContext.getStore()?.serverId;\n  if (active) return active;\n  contextFallbacks += 1;\n  throw new Error("TENANT_CONTEXT_REQUIRED");\n}''', text, count=1, flags=re.S)
          text = text.replace('  const enforceActivationGate = requireExecutable && !context.isPrimary;', '  const enforceActivationGate = requireExecutable;')
          text = text.replace('policy: "tenant-facing-fail-closed;legacy-background-primary-compat"', 'policy: "tenant-context-required;no-primary-fallback"')
          text = re.sub(r'export function getServerStateStoragePath\(serverId = getActiveServerId\(\)\) \{.*?\n\}', '''export function getServerStateStoragePath(serverId = getActiveServerId()) {\n  const context = getServerRuntimeContext(serverId);\n  return path.resolve(process.cwd(), "state_servers", context.serverId, "state.json");\n}''', text, count=1, flags=re.S)
          text = re.sub(r'(?m)^.*getPrimaryServerId.*\n', '', text)
          text = re.sub(r'(?m)^.*getPrimaryServerDescriptor.*\n', '', text)
          if 'getPrimaryServerId' in text or 'getPrimaryServerDescriptor' in text:
              raise SystemExit('serverRuntime.ts still contains primary runtime fallback')
          runtime.write_text(text)

      - name: Typecheck repaired runtime
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -w run typecheck:libs
          pnpm --filter @workspace/api-server typecheck

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/shop.ts artifacts/api-server/src/lib/serverRuntime.ts
          git rm .github/workflows/repair-tenant-startup.yml
          git commit -m "chore: repair tenant startup context"
          git push origin main
