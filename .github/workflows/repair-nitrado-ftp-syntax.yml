name: Repair Nitrado FTP syntax

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair corrupted regex literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/lib/nitradoFtp.ts')
          s = p.read_text()
          s = s.replace('.replace(/\\/g, "/")', '.replace(/\\\\/g, "/")')
          p.write_text(s)
          PY

      - name: Verify repaired source
        run: |
          grep -n '\\.replace(/\\\\/g' artifacts/api-server/src/lib/nitradoFtp.ts

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/lib/nitradoFtp.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair Nitrado FTP path regex syntax'
          git push origin HEAD:main

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/repair-nitrado-ftp-syntax.yml
          git add .github/workflows/repair-nitrado-ftp-syntax.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove one-shot FTP repair workflow'
          git push origin HEAD:main
