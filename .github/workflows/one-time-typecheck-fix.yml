name: One-time typecheck fix

on:
  push:
    branches:
      - patch-1-typecheck-fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal TypeScript fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/api-server/src/lib/state.ts")
          text = path.read_text()
          old = 'bootSource: "pending" as "pending" | "persistence-v2" | "compat-main" | "legacy-main" | "fresh-main" | "local-file" | "local-fallback",'
          new = 'bootSource: "pending" as "pending" | "persistence-v2" | "compat-main" | "legacy-main" | "fresh-main" | "local-file" | "local-fallback" | "neon-read-failed-closed",'
          if old not in text:
              raise SystemExit("Expected bootSource type declaration was not found; refusing to modify the file.")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/one-time-typecheck-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/state.ts .github/workflows/one-time-typecheck-fix.yml
          git commit -m "fix: type secondary state boot metric"
          git push
