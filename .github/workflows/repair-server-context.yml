name: Repair server context paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: remove server-context repair workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply coherent server-context repair
        shell: python
        run: |
          from pathlib import Path
          import re

          shop_path = Path('artifacts/api-server/src/lib/shop.ts')
          shop = shop_path.read_text()

          marker = 'export function getShopFilePaths(serverId = getServerRuntimeContext().serverId) {'
          if marker not in shop:
              raise SystemExit('shop.ts: getShopFilePaths marker not found')

          end_marker = '\n\n\nfunction hasShopBotBlock'
          if 'export function getShopEventsPath(' not in shop:
              block = '''\nexport function getShopEventsPath(serverId = getServerRuntimeContext().serverId) {\n  return getShopFilePaths(serverId).eventsPath;\n}\n\nexport function getShopEventSpawnsPath(serverId = getServerRuntimeContext().serverId) {\n  return getShopFilePaths(serverId).eventSpawnsPath;\n}\n'''
              if end_marker not in shop:
                  raise SystemExit('shop.ts: insertion point not found')
              shop = shop.replace(end_marker, block + end_marker, 1)

          shop = shop.replace('''function getExplicitMissionDir(serverId: string) {\n  if (serverId === getPrimaryServerId()) {\n    return normalizeRelativePath(getServerScopedSettings(serverId).dayzMissionDir);\n  }\n  const server = getManagedServerById(serverId);\n  return normalizeRelativePath(String(server?.runtime.settings?.dayzMissionDir || ""));\n}''', '''function getExplicitMissionDir(serverId: string) {\n  const server = getManagedServerById(serverId);\n  return normalizeRelativePath(String(server?.runtime.settings?.dayzMissionDir || ""));\n}''')

          shop = shop.replace('''  if (runtime.isPrimary) {\n    return missionDir\n      ? { ready: true, serverId: runtime.serverId, transport: "legacy-ftp", missionDir }\n      : { ready: false, serverId: runtime.serverId, transport: "legacy-ftp", reason: "Shop delivery is blocked because the primary mission path is missing." };\n  }\n\n''', '')
          shop_path.write_text(shop)

          map_path = Path('artifacts/api-server/src/lib/mapEvents/mapEventService.ts')
          m = map_path.read_text()
          old_import = 'import { SHOP_EVENTS_PATH, SHOP_EVENT_SPAWNS_PATH } from "../shop";'
          if old_import in m:
              m = m.replace(old_import, 'import { getShopEventsPath, getShopEventSpawnsPath } from "../shop";', 1)
          if 'const MAP_EVENT_SPAWNABLE_TYPES_PATH =' in m:
              m = m.replace('const MAP_EVENT_SPAWNABLE_TYPES_PATH = SHOP_EVENT_SPAWNS_PATH.replace(/\\/cfgeventspawns\\.xml$/i, "/cfgspawnabletypes.xml");', 'function getMapEventSpawnableTypesPath() { return getShopEventSpawnsPath().replace(/\\/cfgeventspawns\\.xml$/i, "/cfgspawnabletypes.xml"); }', 1)
          m = m.replace('const MAP_EVENT_MISSION_DIR = SHOP_EVENTS_PATH.replace(/\\/db\\/events\\.xml$/i, "");\nconst MAP_EVENT_ECONOMY_CORE_PATH = `${MAP_EVENT_MISSION_DIR}/cfgeconomycore.xml`;\nconst MAP_EVENT_MAPGROUPPROTO_PATH = `${MAP_EVENT_MISSION_DIR}/mapgroupproto.xml`;\nconst MAP_EVENT_CUSTOM_TYPES_PATH = `${MAP_EVENT_MISSION_DIR}/custom/locked-container-types.xml`;\nconst MAP_EVENT_GROUPS_PATH = `${MAP_EVENT_MISSION_DIR}/cfgeventgroups.xml`;', '''function getMapEventMissionDir() { return getShopEventsPath().replace(/\\/db\\/events\\.xml$/i, ""); }\nfunction getMapEventEconomyCorePath() { return `${getMapEventMissionDir()}/cfgeconomycore.xml`; }\nfunction getMapEventMapgroupProtoPath() { return `${getMapEventMissionDir()}/mapgroupproto.xml`; }\nfunction getMapEventCustomTypesPath() { return `${getMapEventMissionDir()}/custom/locked-container-types.xml`; }\nfunction getMapEventGroupsPath() { return `${getMapEventMissionDir()}/cfgeventgroups.xml`; }''', 1)
          for old, new in [\n              ('MAP_EVENT_SPAWNABLE_TYPES_PATH', 'getMapEventSpawnableTypesPath()'),\n              ('MAP_EVENT_ECONOMY_CORE_PATH', 'getMapEventEconomyCorePath()'),\n              ('MAP_EVENT_MAPGROUPPROTO_PATH', 'getMapEventMapgroupProtoPath()'),\n              ('MAP_EVENT_CUSTOM_TYPES_PATH', 'getMapEventCustomTypesPath()'),\n              ('MAP_EVENT_GROUPS_PATH', 'getMapEventGroupsPath()'),\n              ('MAP_EVENT_MISSION_DIR', 'getMapEventMissionDir()'),\n              ('SHOP_EVENTS_PATH', 'getShopEventsPath()'),\n              ('SHOP_EVENT_SPAWNS_PATH', 'getShopEventSpawnsPath()'),\n          ]:\n              m = m.replace(old, new)\n          map_path.write_text(m)

          admin_path = Path('artifacts/api-server/src/routes/adminPanel.ts')
          a = admin_path.read_text()
          a = a.replace('deployPendingShopOrders, getShopRuntimeStatus, SHOP_EVENTS_PATH', 'deployPendingShopOrders, getShopRuntimeStatus, getShopEventsPath', 1)
          a = re.sub(r'const SPAWN_ZONE_FILE_PATH = .*?;', 'function getSpawnZoneFilePath(serverId = getActiveServerId()) {\n  return getShopEventsPath(serverId).replace(/\\/db\\/events\\.xml$/i, "/cfgplayerspawnpoints.xml");\n}', a, count=1, flags=re.S)
          a = a.replace('SPAWN_ZONE_FILE_PATH', 'getSpawnZoneFilePath()', 1)
          admin_path.write_text(a)

          # Hard fail if the old module-level path imports survived.
          for path in (map_path, admin_path):
              text = path.read_text()
              if 'SHOP_EVENTS_PATH' in text or 'SHOP_EVENT_SPAWNS_PATH' in text or 'const SPAWN_ZONE_FILE_PATH' in text:
                  raise SystemExit(f'{path}: legacy module-level shop path survived')

      - name: Validate
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          unset npm_config_user_agent
          pnpm install
          pnpm -w run typecheck:libs
          pnpm --filter @workspace/api-server typecheck

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/lib/shop.ts artifacts/api-server/src/lib/mapEvents/mapEventService.ts artifacts/api-server/src/routes/adminPanel.ts .github/workflows/repair-server-context.yml
          git commit -m 'refactor: finish server-context path resolution'
          git rm .github/workflows/repair-server-context.yml
          git commit -m 'chore: remove server-context repair workflow'
          git push origin HEAD:main
