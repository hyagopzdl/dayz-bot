name: Temporary Nitrado compile fix

on:
  push:
    branches:
      - patch-2-nitrado-canonical-upload

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore downloader path helpers
        shell: python
        run: |
          from pathlib import Path
          p = Path("artifacts/api-server/src/lib/nitradoDownloader.ts")
          s = p.read_text()
          if "function getNoFtpRootFromAdmBaseDir" not in s:
              marker = "function withDayzMissionFolderVariants(pathValue: string) {"
              helpers = '''function getNoFtpRootFromAdmBaseDir(serverId = getActiveServerId()) {
                const baseDir = getServerRuntimeContext(serverId).nitrado.baseDir || LEGACY_BASE_DIR;
                const marker = "/noftp/";
                const index = baseDir.indexOf(marker);
                if (index === -1) return "";
                return baseDir.slice(0, index + marker.length - 1);
              }

              function getFtpRootFromAdmBaseDir(serverId = getActiveServerId()) {
                const baseDir = String(getServerRuntimeContext(serverId).nitrado.baseDir || LEGACY_BASE_DIR).replace(/\\\\/g, "/");
                const match = baseDir.match(/^(\\/games\\/[^/]+)\\/(?:noftp|ftproot)(?:\\/|$)/i);
                return match?.[1] ? `${match[1]}/ftproot` : "";
              }

              '''
              if marker not in s: raise SystemExit("Insertion marker not found")
              p.write_text(s.replace(marker, helpers + marker, 1))
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-nitrado-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/nitradoDownloader.ts .github/workflows/temporary-nitrado-fix.yml
          git commit -m "fix: restore downloader path helpers"
          git push origin HEAD:patch-2-nitrado-canonical-upload
