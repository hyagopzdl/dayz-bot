name: Fix admin scheduler syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/adminPanel.ts')
          s=p.read_text()
          old='console.error(`spawn zones automation failed [${server.id}]`, err))));'
          new='console.error(`spawn zones automation failed [${server.id}]`, err)))));'
          assert old in s, 'target syntax not found'
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/routes/adminPanel.ts
          git commit -m 'fix: close server scheduler expression'
          git push
