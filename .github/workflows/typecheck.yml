name: Typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply registry readiness patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('artifacts/api-server/src/lib/state.ts')
          s=p.read_text()
          marker='\n\nexport type PlayerPositionHistoryEventType'
          if 'async function ensureManagedServerRegistryReady()' not in s:
              helper='''\n\nasync function ensureManagedServerRegistryReady() {\n  await ensureManagedServerRegistryMetadata();\n  if (!sql) throw new Error("Server registry is unavailable: DATABASE_URL is not configured.");\n  const rows = await sql`SELECT to_regclass('public.managed_servers') IS NOT NULL AS ready`;\n  if (!Boolean((rows as any[])[0]?.ready)) {\n    const diagnostic = getServerRegistryPersistenceStatus().lastError;\n    throw new Error(diagnostic ? `Server registry is unavailable: managed_servers is not ready (${diagnostic}).` : "Server registry is unavailable: managed_servers table does not exist.");\n  }\n  setServerRegistryPersistenceStatus({ enabled: true, initialized: true, tableReady: true, lastError: undefined });\n}\n'''
              assert marker in s
              s=s.replace(marker,helper+marker,1)
          p1=re.compile(r'await ensureManagedServerRegistryMetadata\(\);\n\s*if \(!sql \|\| !getServerRegistryPersistenceStatus\(\)\.tableReady\) \{\n\s*throw new Error\("Server registry is unavailable\. DATABASE_URL and managed_servers must be ready\."\);\n\s*\}')
          s,n1=p1.subn('await ensureManagedServerRegistryReady();',s)
          p2=re.compile(r'await ensureManagedServerRegistryMetadata\(\);\n\s*if \(!sql \|\| !getServerRegistryPersistenceStatus\(\)\.tableReady\) throw new Error\("Server registry is unavailable\."\);')
          s,n2=p2.subn('await ensureManagedServerRegistryReady();',s)
          print('registry guards replaced',n1+n2)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/lib/state.ts
          git commit -m 'fix: make managed server registry readiness database authoritative' || true
          git push || true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w run typecheck:libs
      - run: pnpm --filter @workspace/api-server typecheck
