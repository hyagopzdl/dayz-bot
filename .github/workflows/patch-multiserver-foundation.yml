name: patch multiserver foundation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'refactor: establish native multi-server foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Patch registry semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/api-server/src/lib/serverRegistry.ts')
          text = path.read_text()

          text = text.replace(
              'export type ServerFoundationMode = "single-server-compat";',
              'export type ServerFoundationMode = "multi-server-native";'
          )
          text = text.replace(
              'function normalizeServerId(value: unknown) {\n  const normalized = buildManagedServerId(value);\n  return normalized || FALLBACK_SERVER_ID;\n}',
              'function normalizeServerId(value: unknown) {\n  return buildManagedServerId(value);\n}'
          )
          text = text.replace(
              '  if (normalized === getPrimaryServerId()) return true;\n  const server = getManagedServerById(normalized);',
              '  if (!normalized) return false;\n  const server = getManagedServerById(normalized);'
          )
          text = text.replace(
              '    mode: "single-server-compat",',
              '    mode: "multi-server-native",'
          )
          text = text.replace(
              '    onboardingStatus: "active",\n    mode: "single-server-compat",',
              '    onboardingStatus: "active",\n    mode: "multi-server-native",'
          )
          text = text.replace(
              '  // Phase 11 allows additional servers to exist as draft/configured/ready registry rows,\n  // while runtime execution remains explicitly primary-only.\n  if (persistedServers.length) return persistedServers.map((server) => ({ ...server, integrations: { ...server.integrations }, runtime: { ...server.runtime, nitradoValidation: server.runtime.nitradoValidation ? { ...server.runtime.nitradoValidation } : undefined, activationPreflight: server.runtime.activationPreflight ? { ...server.runtime.activationPreflight, namespaceRows: { ...server.runtime.activationPreflight.namespaceRows } } : undefined, activation: server.runtime.activation ? { ...server.runtime.activation } : undefined, operations: server.runtime.operations ? { ...server.runtime.operations } : undefined, discord: { ...server.runtime.discord } } }));\n  return [getPrimaryServerDescriptor()];',
              '  return persistedServers.map((server) => ({ ...server, integrations: { ...server.integrations }, runtime: { ...server.runtime, nitradoValidation: server.runtime.nitradoValidation ? { ...server.runtime.nitradoValidation } : undefined, activationPreflight: server.runtime.activationPreflight ? { ...server.runtime.activationPreflight, namespaceRows: { ...server.runtime.activationPreflight.namespaceRows } } : undefined, activation: server.runtime.activation ? { ...server.runtime.activation } : undefined, operations: server.runtime.operations ? { ...server.runtime.operations } : undefined, discord: { ...server.runtime.discord } } }));'
          )
          text = text.replace(
              '    mode: "single-server-compat",',
              '    mode: "multi-server-native",'
          )
          text = text.replace(
              '  const normalized = normalizeServerId(serverId);\n  return listManagedServers().find((server) => server.id === normalized);',
              '  const normalized = buildManagedServerId(serverId);\n  if (!normalized) return undefined;\n  return listManagedServers().find((server) => server.id === normalized);'
          )
          path.write_text(text)

          state = Path('artifacts/api-server/src/lib/state.ts')
          text = state.read_text()
          old = '''      await sql`\n        UPDATE managed_servers\n        SET runtime_config = jsonb_set(\n              COALESCE(runtime_config, '{}'::jsonb),\n              '{settings}',\n              ${JSON.stringify(defaultServerSettings)}::jsonb,\n              TRUE\n            ),\n            updated_at = NOW()\n        WHERE runtime_config IS NULL OR runtime_config->'settings' IS NULL\n      `;'''
          new = '''      await sql`\n        UPDATE managed_servers\n        SET runtime_config = CASE\n              WHEN runtime_config IS NULL THEN jsonb_build_object(\n                'settings', ${JSON.stringify(defaultServerSettings)}::jsonb\n              )\n              WHEN jsonb_typeof(runtime_config) = 'object' THEN jsonb_set(\n                runtime_config,\n                '{settings}',\n                ${JSON.stringify(defaultServerSettings)}::jsonb,\n                TRUE\n              )\n              ELSE runtime_config\n            END,\n            updated_at = NOW()\n        WHERE runtime_config IS NULL\n           OR (jsonb_typeof(runtime_config) = 'object' AND runtime_config->'settings' IS NULL)\n      `;'''
          if old not in text:
              raise SystemExit('expected runtime_config initialization block not found')
          state.write_text(text.replace(old, new))
      
      - name: Typecheck
        run: pnpm --filter @workspace/api-server typecheck

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-multiserver-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/lib/serverRegistry.ts artifacts/api-server/src/lib/state.ts .github/workflows/patch-multiserver-foundation.yml
          git diff --cached --check
          git commit -m 'refactor: establish native multi-server foundation'
          git push origin main
