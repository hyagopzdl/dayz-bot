name: One-time clean multi-server architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply context-safe multi-server codemod
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          src = root / 'artifacts/api-server/src'
          registry = src / 'lib/serverRegistry.ts'
          state = src / 'lib/state.ts'

          def remove_function(text, name):
              marker = re.search(r'(?m)^(?:export\s+)?(?:async\s+)?function\s+' + re.escape(name) + r'\b', text)
              if not marker:
                  return text
              start = marker.start()
              brace = text.find('{', marker.end())
              if brace < 0:
                  raise RuntimeError(f'Cannot find body for {name}')
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 1
                  elif quote:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == quote: quote = None
                  else:
                      if c == '/' and n == '/': line_comment = True; i += 1
                      elif c == '/' and n == '*': block_comment = True; i += 1
                      elif c in ('"', "'", '`'): quote = c
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return text[:start] + text[i + 1:]
                  i += 1
              raise RuntimeError(f'Unbalanced braces in {name}')

          # Registry is the source of truth. No primary-server field or fallback remains.
          r = registry.read_text()
          r = re.sub(r'\n\s*/\*\* @deprecated Persistence no longer creates or selects a primary server\. \*/\n\s*primary\?: boolean;', '', r)
          r = re.sub(r'\n\s*/\*\* @deprecated No longer seeded; retained for persisted diagnostic compatibility\. \*/\n\s*primarySeeded\?: boolean;', '', r)
          r = r.replace('const resolved = requested || (persistedServers.length === 1 ? persistedServers[0].id : "");', 'const resolved = requested;')
          r = remove_function(r, 'getPrimaryServerId')
          r = remove_function(r, 'getPrimaryServerDescriptor')
          if 'export function requireManagedServer(' not in r:
              marker = 'export function getManagedServerById(serverId: unknown) { const normalized = normalizeServerId(serverId); return normalized ? persistedServers.find((server) => server.id === normalized) : undefined; }'
              replacement = marker + '\nexport function requireManagedServer(serverId: unknown): ManagedServerDescriptor {\n  const server = getManagedServerById(serverId);\n  if (!server) throw new Error(`Servidor ${normalizeServerId(serverId) || "desconhecido"} nao encontrado.`);\n  return server;\n}'
              if marker not in r:
                  raise RuntimeError('serverRegistry getManagedServerById marker not found')
              r = r.replace(marker, replacement)
          registry.write_text(r)

          # State: make every implicit server reference use the active execution context.
          s = state.read_text()
          s = remove_function(s, 'ensurePrimaryServerRegistryMetadata')
          s = remove_function(s, 'maybeWriteCompatibilitySnapshot')
          s = s.replace('const LEGACY_FILE = path.resolve(process.cwd(), "state.json");\n', '')
          s = re.sub(r'^\s*const STATE_COMPAT_SNAPSHOT_MS = .*\n', '', s, flags=re.M)
          s = re.sub(r'^\s*lastCompatibilitySnapshotAt: number;\n', '', s, flags=re.M)
          s = re.sub(r'^\s*lastCompatibilitySnapshotAt: 0,\n', '', s, flags=re.M)
          s = re.sub(r'^\s*compatibilitySnapshotMs: STATE_COMPAT_SNAPSHOT_MS,\n', '', s, flags=re.M)
          s = re.sub(r'^\s*compatibilitySnapshots: 0,\n', '', s, flags=re.M)
          s = re.sub(r'\n\s*(?:await\s+)?maybeWriteCompatibilitySnapshot\([^;]*\);', '', s)
          s = re.sub(r'function getLocalStateFile\(\) \{.*?\n\}', 'function getLocalStateFile() {\n  return getServerStateStoragePath(getActiveServerId());\n}', s, flags=re.S)
          s = s.replace('  getPrimaryServerDescriptor,\n', '').replace('  getPrimaryServerId,\n', '')
          s = s.replace('getPrimaryServerId()', 'getActiveServerId()')
          s = s.replace('getPrimaryServerDescriptor()', 'requireManagedServer(getActiveServerId())')
          s = s.replace('  getActiveServerId,', '  getActiveServerId,')
          s = s.replace('  type ServerScopedSettings,\n', '  type ServerScopedSettings,\n  requireManagedServer,\n')
          s = re.sub(r'(?m)^\s*await ensurePrimaryServerRegistryMetadata\(\);\s*$', '', s)
          s = re.sub(r'(?m)^\s*primary:\s*[^,]+,\s*$', '', s)
          state.write_text(s)

          # All source modules: replace primary helpers with explicit active execution context.
          for file in src.rglob('*.ts'):
              text = file.read_text()
              if file == registry or file == state:
                  continue
              original = text
              text = text.replace('getPrimaryServerId()', 'getActiveServerId()')
              text = text.replace('getPrimaryServerDescriptor()', 'requireManagedServer(getActiveServerId())')
              text = re.sub(r'\bserver\.primary\b', 'false', text)
              text = re.sub(r'\bprimary\.id\b', 'server.id', text)
              text = re.sub(r'\bprimary\.runtime\b', 'server.runtime', text)
              text = re.sub(r'\bprimary\.name\b', 'server.name', text)
              text = re.sub(r'(?m)^\s*primary:\s*[^,]+,\s*$', '', text)
              text = text.replace('isPrimary: true', 'isPrimary: false')
              text = text.replace('isPrimary: false', 'isPrimary: false')
              text = re.sub(r'\bprimaryServerId\b', 'activeServerId', text)
              text = text.replace('primaryServer', 'activeServer')
              if text != original:
                  # Remove primary helper names from imports.
                  text = re.sub(r'\s*getPrimaryServerId,?', '', text)
                  text = re.sub(r'\s*getPrimaryServerDescriptor,?', '', text)
                  # Ensure active context + explicit descriptor helper are imported.
                  needs_active = 'getActiveServerId()' in text or 'requireManagedServer(' in text
                  if needs_active:
                      if 'from "./serverRuntime"' in text:
                          text = re.sub(r'import \{([^}]*)\} from "\./serverRuntime";', lambda m: 'import {' + (m.group(1).rstrip() + ', ' if m.group(1).strip() else '') + 'getActiveServerId } from "./serverRuntime";', text, count=1)
                      elif 'from "../serverRuntime"' in text:
                          text = re.sub(r'import \{([^}]*)\} from "\.\./serverRuntime";', lambda m: 'import {' + (m.group(1).rstrip() + ', ' if m.group(1).strip() else '') + 'getActiveServerId } from "../serverRuntime";', text, count=1)
                      elif 'from "../../serverRuntime"' in text:
                          text = re.sub(r'import \{([^}]*)\} from "\.\./\.\./serverRuntime";', lambda m: 'import {' + (m.group(1).rstrip() + ', ' if m.group(1).strip() else '') + 'getActiveServerId } from "../../serverRuntime";', text, count=1)
                      else:
                          prefix = 'import { getActiveServerId } from "./serverRuntime";\n' if 'lib/' in str(file) and file.parent.name == 'lib' else None
                          if str(file).endswith('/discord/channels.ts') or str(file).endswith('/discord/commands.ts') or str(file).endswith('/discord/stateAccess.ts'):
                              prefix = 'import { getActiveServerId } from "../serverRuntime";\n'
                          elif '/discord/modules/' in str(file):
                              prefix = 'import { getActiveServerId } from "../../serverRuntime";\n'
                          elif '/routes/' in str(file):
                              prefix = 'import { getActiveServerId } from "../lib/serverRuntime";\n'
                          elif str(file).endswith('/lib/state.ts'):
                              prefix = 'import { getActiveServerId } from "./serverRuntime";\n'
                          else:
                              prefix = 'import { getActiveServerId } from "./serverRuntime";\n'
                          if prefix and 'getActiveServerId' not in text.split('\n', 15).__str__():
                              text = prefix + text
                  if 'requireManagedServer(' in text:
                      # Add helper to existing serverRegistry import where possible.
                      if 'from "./serverRegistry"' in text:
                          text = re.sub(r'import \{([^}]*)\} from "\./serverRegistry";', lambda m: 'import {' + (m.group(1).rstrip() + ', ' if m.group(1).strip() else '') + 'requireManagedServer } from "./serverRegistry";', text, count=1)
                      elif 'from "../serverRegistry"' in text:
                          text = re.sub(r'import \{([^}]*)\} from "\.\./serverRegistry";', lambda m: 'import {' + (m.group(1).rstrip() + ', ' if m.group(1).strip() else '') + 'requireManagedServer } from "../serverRegistry";', text, count=1)
                      elif 'from "../../serverRegistry"' in text:
                          text = re.sub(r'import \{([^}]*)\} from "\.\./\.\./serverRegistry";', lambda m: 'import {' + (m.group(1).rstrip() + ', ' if m.group(1).strip() else '') + 'requireManagedServer } from "../../serverRegistry";', text, count=1)
              file.write_text(text)

          print('Context-safe codemod applied.')

      - name: Verify no primary runtime helpers remain
        run: |
          if grep -RInE 'getPrimaryServer(Id|Descriptor)\(|\.primary\b|ensurePrimaryServerRegistryMetadata\(' artifacts/api-server/src --include='*.ts'; then
            echo 'Legacy primary runtime references remain.'
            exit 1
          fi

      - name: Typecheck
        run: corepack enable && corepack pnpm install --no-frozen-lockfile --ignore-scripts && corepack pnpm run typecheck

      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src
          git rm .github/workflows/one-time-clean-multiserver.yml artifacts/api-server/src/lib/.gitkeep
          git diff --cached --quiet || git commit -m "refactor: remove primary server runtime fallback"
          git push
