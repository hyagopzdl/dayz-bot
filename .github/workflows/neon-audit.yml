name: Neon audit

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory database access
        shell: bash
        run: |
          set -euo pipefail
          echo '=== POSTGRES/PG CLIENTS ==='
          grep -RInE --include='*.ts' --include='*.js' --include='*.mjs' --include='*.json' 'from ["'"'](postgres|pg|@workspace/db)|require\(["'"'](postgres|pg|@workspace/db)|postgres\(|new Pool|new pg\.Pool|DATABASE_URL|drizzle-orm/node-postgres' artifacts lib scripts package.json pnpm-workspace.yaml || true
          echo '=== SQL OPERATIONS ==='
          grep -RInE --include='*.ts' --include='*.js' --include='*.mjs' 'sql`|sql\.unsafe|sql\.begin|\.query\(|db\.(select|insert|update|delete)|CREATE TABLE|ALTER TABLE|CREATE INDEX|DROP TABLE' artifacts lib scripts || true
          echo '=== TIMERS/SCHEDULERS/RETRIES ==='
          grep -RInE --include='*.ts' --include='*.js' --include='*.mjs' 'setInterval|setTimeout|setImmediate|cron|retry|poll' artifacts/api-server/src lib scripts || true
          echo '=== STATE/REGISTRY REFERENCES ==='
          grep -RInE --include='*.ts' 'ensurePrimaryServerRegistryMetadata|refreshManagedServerRegistryFromDb|getStateAsync|saveStateAsync|flushPendingDomains|scheduleTenantCommerceMirror|hydrateKnownServerPlayers' artifacts/api-server/src || true
          echo '=== TYPECHECK ==='
          corepack pnpm install --no-frozen-lockfile --ignore-scripts
          corepack pnpm --filter @workspace/api-server run typecheck
