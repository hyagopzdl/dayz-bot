name: Repair patch 2 workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove invalid replacement
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/patch-2-native-nitrado.yml')
          text = p.read_text()
          bad = '''          replace(\n              "artifacts/api-server/src/lib/organizationIntegrations.ts",\n              ''' + "'''    return decryptOrganizationSecret(record);'''" + ''',\n              ''' + "'''    return decryptEncryptedSecret(record);'''" + '''\n          )\n\n'''
          if bad not in text:
              raise SystemExit('invalid replacement block not found; refusing blind edit')
          p.write_text(text.replace(bad, '', 1))
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-2-native-nitrado.yml
          git rm .github/workflows/repair-patch-2.yml
          git diff --cached --check
          git commit -m "chore: fix patch 2 workflow"
          git push
