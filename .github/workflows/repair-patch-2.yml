name: Repair patch 2 workflow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove invalid replacement
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/patch-2-native-nitrado.yml')
          text = p.read_text()
          marker = '          # Organization integration decryption becomes reusable by the server-scoped\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('organization decryption marker not found')
          block_start = text.find('          replace(', start)
          next_marker = '          # Downloader consumes the common resolver:'
          end = text.find(next_marker, block_start)
          if block_start < 0 or end < 0:
              raise SystemExit('invalid organization replacement block not found')
          block = text[block_start:end]
          lines = block.splitlines(True)
          if len(lines) < 1 or 'return decryptEncryptedSecret' not in block:
              raise SystemExit('refusing to remove unexpected block')
          p.write_text(text[:block_start] + text[end:])
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-2-native-nitrado.yml
          git rm .github/workflows/repair-patch-2.yml
          git diff --cached --check
          git commit -m "chore: fix patch 2 workflow"
          git push
