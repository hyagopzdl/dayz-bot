name: One-time Neon connection cleanup

on:
  push:
    branches: [main]

jobs:
  clean:
    if: github.event.head_commit.message != 'chore: finalize Neon connection cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Harden postgres.js clients
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          targets = [
              Path('artifacts/api-server/src/lib/state.ts'),
              Path('artifacts/api-server/src/lib/tenantCommerceStore.ts'),
          ]

          old = '''postgres(process.env.DATABASE_URL, {\n      ssl: "require",\n      max: 1,\n    })'''
          new = '''postgres(process.env.DATABASE_URL, {\n      ssl: "require",\n      max: 1,\n      idle_timeout: 30,\n      connect_timeout: 10,\n      max_lifetime: 1800,\n      connection: { application_name: "dayz-bot-api" },\n    })'''

          for path in targets:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected postgres client pattern not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify source and typecheck
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn --include='*.ts' -A7 'postgres(process.env.DATABASE_URL' artifacts/api-server/src/lib
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/api-server typecheck

      - name: Commit hardened clients and remove audit workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-neon-connection-clean.yml .github/workflows/neon-audit.yml
          git add artifacts/api-server/src/lib/state.ts artifacts/api-server/src/lib/tenantCommerceStore.ts .github/workflows/one-time-neon-connection-clean.yml .github/workflows/neon-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize Neon connection cleanup'
          git push
