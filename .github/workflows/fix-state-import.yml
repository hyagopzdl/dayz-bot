name: Fix state registry import
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/lib/state.ts')
          s=p.read_text()
          old='  normalizeManagedServerName,\n'
          assert old in s
          s=s.replace(old, '  normalizeManagedServerName,\n  normalizeServerOnboardingStatus,\n', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src/lib/state.ts
          git commit -m 'fix: import server onboarding status normalizer'
          git push
