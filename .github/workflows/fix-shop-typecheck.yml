name: repair shop typecheck

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Repair shop server scoping
        shell: python
        run: |
          from pathlib import Path
          import re

          shop = Path('artifacts/api-server/src/lib/shop.ts')
          text = shop.read_text()

          if 'getServerScopedSettings' not in text:
              text = text.replace('  getManagedServerById,\n', '  getManagedServerById,\n  getServerScopedSettings,\n', 1)

          text = re.sub(
              r'function parseRestartTimes\(\) \{.*?\n\}',
              '''function parseRestartTimes() {
            const raw = String(getServerScopedSettings(getServerRuntimeContext().serverId).shopRestartTimes || "");

            return raw
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean)
              .map((value) => {
                const [hourRaw, minuteRaw = "0"] = value.split(":");
                const hour = Number(hourRaw);
                const minute = Number(minuteRaw);
                if (!Number.isInteger(hour) || !Number.isInteger(minute) || hour < 0 || hour > 23 || minute < 0 || minute > 59) {
                  throw new Error(`Invalid SHOP_RESTART_TIMES entry: ${value}`);
                }
                return { label: `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`, minutes: hour * 60 + minute };
              })
              .sort((a, b) => a.minutes - b.minutes);
          }''',
              text, count=1, flags=re.S
          )

          if 'const timeZone = String(getServerScopedSettings' not in text:
              text = text.replace(
                  '  const times = parseRestartTimes();\n  if (!times.length) return null;\n\n',
                  '  const times = parseRestartTimes();\n  if (!times.length) return null;\n\n  const timeZone = String(getServerScopedSettings(getServerRuntimeContext().serverId).shopRestartTimezone || "UTC").trim() || "UTC";\n',
                  1
              )

          marker = 'export function getShopFilePaths(serverId = getServerRuntimeContext().serverId) {'
          if 'export function getShopEventsPath(' not in text:
              text = text.replace(marker, '''export function getShopEventsPath(serverId = getServerRuntimeContext().serverId) {
            return getShopFilePaths(serverId).eventsPath;
          }

          export function getShopEventSpawnsPath(serverId = getServerRuntimeContext().serverId) {
            return getShopFilePaths(serverId).eventSpawnsPath;
          }

          ''' + marker, 1)
          shop.write_text(text)

          service = Path('artifacts/api-server/src/lib/mapEvents/mapEventService.ts')
          s = service.read_text()
          s = re.sub(
              r'import \{ SHOP_EVENTS_PATH, SHOP_EVENT_SPAWNS_PATH \} from "\.\./shop";\n.*?const AIRDROP_MILITARY_GROUP_NAME',
              '''import { getShopEventsPath, getShopEventSpawnsPath } from "../shop";
          import { getMapEventPresets } from "./mapEventPresets";
          import {
            hasMapEventBlock,
            injectMapEventIntoEventSpawnsXml,
            injectMapEventIntoEventsXml,
            injectMapEventIntoSpawnableTypesXml,
            removeMapEventBlocks,
            resolveMapEventRequest,
          } from "./mapEventXml";
          import type { MapEventCleanupResult, MapEventDeployResult, MapEventInjectRequest } from "./mapEventTypes";

          function getMapEventSpawnableTypesPath(serverId: string) { return getShopEventSpawnsPath(serverId).replace(/\\/cfgeventspawns\\.xml$/i, "/cfgspawnabletypes.xml"); }
          function getMapEventMissionDir(serverId: string) { return getShopEventsPath(serverId).replace(/\\/db\\/events\\.xml$/i, ""); }
          function getMapEventEconomyCorePath(serverId: string) { return `${getMapEventMissionDir(serverId)}/cfgeconomycore.xml`; }
          function getMapEventMapgroupProtoPath(serverId: string) { return `${getMapEventMissionDir(serverId)}/mapgroupproto.xml`; }
          function getMapEventCustomTypesPath(serverId: string) { return `${getMapEventMissionDir(serverId)}/custom/locked-container-types.xml`; }
          function getMapEventGroupsPath(serverId: string) { return `${getMapEventMissionDir(serverId)}/cfgeventgroups.xml`; }

          const AIRDROP_MILITARY_GROUP_NAME''',
              s, count=1, flags=re.S
          )
          for old, new in [
              ('MAP_EVENT_SPAWNABLE_TYPES_PATH', 'getMapEventSpawnableTypesPath(serverId)'),
              ('MAP_EVENT_ECONOMY_CORE_PATH', 'getMapEventEconomyCorePath(serverId)'),
              ('MAP_EVENT_MAPGROUPPROTO_PATH', 'getMapEventMapgroupProtoPath(serverId)'),
              ('MAP_EVENT_CUSTOM_TYPES_PATH', 'getMapEventCustomTypesPath(serverId)'),
              ('MAP_EVENT_GROUPS_PATH', 'getMapEventGroupsPath(serverId)'),
              ('MAP_EVENT_MISSION_DIR', 'getMapEventMissionDir(serverId)'),
              ('SHOP_EVENTS_PATH', 'getShopEventsPath(serverId)'),
              ('SHOP_EVENT_SPAWNS_PATH', 'getShopEventSpawnsPath(serverId)'),
          ]:
              s = s.replace(old, new)
          service.write_text(s)

          admin = Path('artifacts/api-server/src/routes/adminPanel.ts')
          a = admin.read_text()
          a = a.replace('deployPendingShopOrders, getShopRuntimeStatus, SHOP_EVENTS_PATH', 'deployPendingShopOrders, getShopRuntimeStatus, getShopEventsPath')
          a = a.replace('SHOP_EVENTS_PATH', 'getShopEventsPath(serverId)')
          admin.write_text(a)

      - name: Typecheck
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          unset npm_config_user_agent
          pnpm install
          pnpm -w run typecheck:libs
          pnpm --filter @workspace/api-server typecheck

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/shop.ts artifacts/api-server/src/lib/mapEvents/mapEventService.ts artifacts/api-server/src/routes/adminPanel.ts
          git rm .github/workflows/fix-shop-typecheck.yml
          git commit -m "fix: restore tenant-scoped shop typecheck"
          git push origin main
