name: repair shop typecheck
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Repair server-scoped paths and shop settings
        shell: python
        run: |
          from pathlib import Path
          import re

          shop = Path("artifacts/api-server/src/lib/shop.ts")
          text = shop.read_text()
          if "export function getShopEventsPath(" not in text:
              marker = "export function getShopFilePaths(serverId = getServerRuntimeContext().serverId) {"
              idx = text.index(marker)
              end = text.index("\n}\n", idx) + 3
              block = '''\nexport function getShopEventsPath(serverId = getServerRuntimeContext().serverId) {\n  return getShopFilePaths(serverId).eventsPath;\n}\n\nexport function getShopEventSpawnsPath(serverId = getServerRuntimeContext().serverId) {\n  return getShopFilePaths(serverId).eventSpawnsPath;\n}\n'''
              text = text[:end] + block + text[end:]
          text = text.replace(
              '''function parseRestartTimes() {\n\n  return raw''',
              '''function parseRestartTimes() {\n  const raw = String(\n    getManagedServerById(getServerRuntimeContext().serverId)?.runtime.settings?.shopRestartTimes || ""\n  );\n\n  return raw''',
              1,
          )
          text = text.replace(
              "  const local = getLocalDateParts(now, timeZone);",
              '''  const timeZone = String(\n    getManagedServerById(getServerRuntimeContext().serverId)?.runtime.settings?.shopRestartTimezone || "UTC"\n  ).trim() || "UTC";\n  const local = getLocalDateParts(now, timeZone);''',
              1,
          )
          shop.write_text(text)

          mp = Path("artifacts/api-server/src/lib/mapEvents/mapEventService.ts")
          text = mp.read_text()
          text = text.replace(
              'import { SHOP_EVENTS_PATH, SHOP_EVENT_SPAWNS_PATH } from "../shop";',
              'import { getShopEventsPath, getShopEventSpawnsPath } from "../shop";',
          )
          # Remove any existing static path declarations and replace them with context-resolved functions.
          text = re.sub(r'^const MAP_EVENT_SPAWNABLE_TYPES_PATH = .*?;$', 'function resolveMapEventSpawnableTypesPath() {\n  return getShopEventSpawnsPath().replace(/\\/cfgeventspawns\\.xml$/i, "/cfgspawnabletypes.xml");\n}', text, flags=re.M)
          text = re.sub(r'^const MAP_EVENT_MISSION_DIR = .*?;$', 'function resolveMapEventMissionDir() {\n  return getShopEventsPath().replace(/\\/db\\/events\\.xml$/i, "");\n}', text, flags=re.M)
          text = re.sub(r'^const MAP_EVENT_ECONOMY_CORE_PATH = .*?;$', 'function resolveMapEventEconomyCorePath() {\n  return `${resolveMapEventMissionDir()}/cfgeconomycore.xml`;\n}', text, flags=re.M)
          text = re.sub(r'^const MAP_EVENT_MAPGROUPPROTO_PATH = .*?;$', 'function resolveMapEventMapgroupProtoPath() {\n  return `${resolveMapEventMissionDir()}/mapgroupproto.xml`;\n}', text, flags=re.M)
          text = re.sub(r'^const MAP_EVENT_CUSTOM_TYPES_PATH = .*?;$', 'function resolveMapEventCustomTypesPath() {\n  return `${resolveMapEventMissionDir()}/custom/locked-container-types.xml`;\n}', text, flags=re.M)
          text = re.sub(r'^const MAP_EVENT_GROUPS_PATH = .*?;$', 'function resolveMapEventGroupsPath() {\n  return `${resolveMapEventMissionDir()}/cfgeventgroups.xml`;\n}', text, flags=re.M)
          replacements = {
              "MAP_EVENT_SPAWNABLE_TYPES_PATH": "resolveMapEventSpawnableTypesPath()",
              "MAP_EVENT_MISSION_DIR": "resolveMapEventMissionDir()",
              "MAP_EVENT_ECONOMY_CORE_PATH": "resolveMapEventEconomyCorePath()",
              "MAP_EVENT_MAPGROUPPROTO_PATH": "resolveMapEventMapgroupProtoPath()",
              "MAP_EVENT_CUSTOM_TYPES_PATH": "resolveMapEventCustomTypesPath()",
              "MAP_EVENT_GROUPS_PATH": "resolveMapEventGroupsPath()",
              "SHOP_EVENTS_PATH": "getShopEventsPath()",
              "SHOP_EVENT_SPAWNS_PATH": "getShopEventSpawnsPath()",
          }
          for old_name, new_name in replacements.items():
              text = re.sub(rf'\b{old_name}\b', new_name, text)
          mp.write_text(text)

          admin = Path("artifacts/api-server/src/routes/adminPanel.ts")
          text = admin.read_text()
          text = text.replace(
              'import { deployPendingShopOrders, getShopRuntimeStatus, SHOP_EVENTS_PATH } from "../lib/shop";',
              'import { deployPendingShopOrders, getShopRuntimeStatus, getShopEventsPath } from "../lib/shop";',
          )
          text = re.sub(r'^const SPAWN_ZONE_FILE_PATH = .*?;$', 'function resolveSpawnZoneFilePath() {\n  return getShopEventsPath().replace(/\\/db\\/events\\.xml$/i, "/cfgplayerspawnpoints.xml");\n}', text, flags=re.M)
          text = re.sub(r'\bSPAWN_ZONE_FILE_PATH\b', 'resolveSpawnZoneFilePath()', text)
          text = re.sub(r'\bSHOP_EVENTS_PATH\b', 'getShopEventsPath()', text)
          admin.write_text(text)

          print("Applied deterministic server-scoped shop/map-event repairs.")
      - name: Validate full workspace
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          unset npm_config_user_agent
          pnpm install
          pnpm -w run typecheck:libs
          pnpm --filter @workspace/api-server typecheck
      - name: Commit repair and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/shop.ts artifacts/api-server/src/lib/mapEvents/mapEventService.ts artifacts/api-server/src/routes/adminPanel.ts
          git commit -m "fix: apply server-scoped shop map-event paths"
          git rm .github/workflows/fix-shop-typecheck.yml
          git commit -m "chore: remove temporary shop repair workflow"
          git push origin main
