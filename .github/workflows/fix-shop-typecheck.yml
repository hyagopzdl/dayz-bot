name: repair shop typecheck

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Repair tenant-scoped shop helpers
        shell: python
        run: |
          from pathlib import Path

          shop = Path('artifacts/api-server/src/lib/shop.ts')
          text = shop.read_text()

          if 'getServerScopedSettings,' not in text:
              old_import = '''  getManagedServerById,\n  hasManagedServerRuntimeActivation,'''
              new_import = '''  getManagedServerById,\n  getServerScopedSettings,\n  hasManagedServerRuntimeActivation,'''
              if old_import not in text:
                  raise SystemExit('shop import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_parse = '''function parseRestartTimes() {\n\n  return raw'''
          new_parse = '''function parseRestartTimes() {\n  const raw = String(getServerScopedSettings(getServerRuntimeContext().serverId).shopRestartTimes || "");\n\n  return raw'''
          if old_parse in text:
              text = text.replace(old_parse, new_parse, 1)
          elif 'const raw = String(getServerScopedSettings(getServerRuntimeContext().serverId).shopRestartTimes' not in text:
              raise SystemExit('parseRestartTimes repair anchor not found')

          old_window = '''  const times = parseRestartTimes();\n  if (!times.length) return null;\n\n  const deployBefore = numberEnv("SHOP_DEPLOY_MINUTES_BEFORE_RESET", 15);'''
          new_window = '''  const times = parseRestartTimes();\n  if (!times.length) return null;\n\n  const timeZone = String(getServerScopedSettings(getServerRuntimeContext().serverId).shopRestartTimezone || "UTC").trim() || "UTC";\n  const deployBefore = numberEnv("SHOP_DEPLOY_MINUTES_BEFORE_RESET", 15);'''
          if old_window in text:
              text = text.replace(old_window, new_window, 1)
          elif 'getServerScopedSettings(getServerRuntimeContext().serverId).shopRestartTimezone' not in text:
              raise SystemExit('auto-deploy timezone repair anchor not found')

          marker = '''export function getShopFilePaths(serverId = getServerRuntimeContext().serverId) {'''
          if marker not in text:
              raise SystemExit('getShopFilePaths marker not found')
          if 'export function getShopEventsPath(' not in text:
              helpers = '''export function getShopEventsPath(serverId = getServerRuntimeContext().serverId) {\n  return getShopFilePaths(serverId).eventsPath;\n}\n\nexport function getShopEventSpawnsPath(serverId = getServerRuntimeContext().serverId) {\n  return getShopFilePaths(serverId).eventSpawnsPath;\n}\n\n'''
              text = text.replace(marker, helpers + marker, 1)
          shop.write_text(text)

          service = Path('artifacts/api-server/src/lib/mapEvents/mapEventService.ts')
          s = service.read_text()
          s = s.replace('import { SHOP_EVENTS_PATH, SHOP_EVENT_SPAWNS_PATH } from "../shop";', 'import { getShopEventsPath, getShopEventSpawnsPath } from "../shop";')
          s = s.replace('const MAP_EVENT_SPAWNABLE_TYPES_PATH = SHOP_EVENT_SPAWNS_PATH.replace(/\\/cfgeventspawns\\.xml$/i, "/cfgspawnabletypes.xml");', 'function getMapEventSpawnableTypesPath(serverId: string) { return getShopEventSpawnsPath(serverId).replace(/\\/cfgeventspawns\\.xml$/i, "/cfgspawnabletypes.xml"); }')
          s = s.replace('const MAP_EVENT_MISSION_DIR = SHOP_EVENTS_PATH.replace(/\\/db\\/events\\.xml$/i, "");', 'function getMapEventMissionDir(serverId: string) { return getShopEventsPath(serverId).replace(/\\/db\\/events\\.xml$/i, ""); }')
          s = s.replace('const MAP_EVENT_ECONOMY_CORE_PATH = `${MAP_EVENT_MISSION_DIR}/cfgeconomycore.xml`;', 'function getMapEventEconomyCorePath(serverId: string) { return `${getMapEventMissionDir(serverId)}/cfgeconomycore.xml`; }')
          s = s.replace('const MAP_EVENT_MAPGROUPPROTO_PATH = `${MAP_EVENT_MISSION_DIR}/mapgroupproto.xml`;', 'function getMapEventMapgroupProtoPath(serverId: string) { return `${getMapEventMissionDir(serverId)}/mapgroupproto.xml`; }')
          s = s.replace('const MAP_EVENT_CUSTOM_TYPES_PATH = `${MAP_EVENT_MISSION_DIR}/custom/locked-container-types.xml`;', 'function getMapEventCustomTypesPath(serverId: string) { return `${getMapEventMissionDir(serverId)}/custom/locked-container-types.xml`; }')
          s = s.replace('const MAP_EVENT_GROUPS_PATH = `${MAP_EVENT_MISSION_DIR}/cfgeventgroups.xml`;', 'function getMapEventGroupsPath(serverId: string) { return `${getMapEventMissionDir(serverId)}/cfgeventgroups.xml`; }')
          s = s.replace('MAP_EVENT_SPAWNABLE_TYPES_PATH', 'getMapEventSpawnableTypesPath(serverId)')
          s = s.replace('MAP_EVENT_ECONOMY_CORE_PATH', 'getMapEventEconomyCorePath(serverId)')
          s = s.replace('MAP_EVENT_MAPGROUPPROTO_PATH', 'getMapEventMapgroupProtoPath(serverId)')
          s = s.replace('MAP_EVENT_CUSTOM_TYPES_PATH', 'getMapEventCustomTypesPath(serverId)')
          s = s.replace('MAP_EVENT_GROUPS_PATH', 'getMapEventGroupsPath(serverId)')
          s = s.replace('MAP_EVENT_MISSION_DIR', 'getMapEventMissionDir(serverId)')
          s = s.replace('SHOP_EVENTS_PATH', 'getShopEventsPath(serverId)')
          s = s.replace('SHOP_EVENT_SPAWNS_PATH', 'getShopEventSpawnsPath(serverId)')
          service.write_text(s)

          admin = Path('artifacts/api-server/src/routes/adminPanel.ts')
          a = admin.read_text()
          a = a.replace('deployPendingShopOrders, getShopRuntimeStatus, SHOP_EVENTS_PATH', 'deployPendingShopOrders, getShopRuntimeStatus, getShopEventsPath')
          a = a.replace('SHOP_EVENTS_PATH', 'getShopEventsPath(serverId)')
          admin.write_text(a)

      - name: Typecheck
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
          unset npm_config_user_agent
          pnpm --version
          pnpm install
          pnpm -w run typecheck:libs
          pnpm --filter @workspace/api-server typecheck

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/lib/shop.ts artifacts/api-server/src/lib/mapEvents/mapEventService.ts artifacts/api-server/src/routes/adminPanel.ts
          git rm .github/workflows/fix-shop-typecheck.yml
          git commit -m "fix: restore tenant-scoped shop typecheck"
          git push origin main
