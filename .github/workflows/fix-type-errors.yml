name: Fix primary migration type errors
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('artifacts/api-server/src/lib/serverRegistry.ts')
          s=p.read_text()
          s=s.replace('function normalizeServerOnboardingStatus(value: unknown)', 'export function normalizeServerOnboardingStatus(value: unknown)', 1)
          marker='export function listManagedServers()'
          assert marker in s
          s=s.replace(marker, 'export function getPrimaryServerId() { return ""; }\n\n'+marker, 1)
          p.write_text(s)

          p=Path('artifacts/api-server/src/routes/nitradoDiagnostic.ts')
          s=p.read_text()
          s=s.replace('import { getOrganizationIntegrationStatus } from "../lib/organizationIntegrations";', 'import { getOrganizationIntegrationStatus } from "../lib/organizationIntegrations";\nimport { getActiveServerId } from "../lib/serverRuntime";')
          p.write_text(s)

          p=Path('artifacts/api-server/src/routes/playerPortal.ts')
          s=p.read_text()
          s=s.replace('async function getPrimaryIdentityImportOptions(_state: AppState, _session: PortalSession) {', 'async function getPrimaryIdentityImportOptions(_state: AppState, _session: PortalSession): Promise<{ candidates: string[] } | null> {')
          p.write_text(s)

          p=Path('artifacts/api-server/src/routes/adminPanel.ts')
          s=p.read_text()
          s=s.replace('if (!server) return res.status(404).json({ error: "SERVER_CONTEXT_REQUIRED" });\n  res.json({ server, foundation: foundationForRequest(req) });', 'if (!server) { res.status(404).json({ error: "SERVER_CONTEXT_REQUIRED" }); return; }\n  res.json({ server, foundation: foundationForRequest(req) });', 1)
          s=s.replace('if (!serverDescriptor) return res.status(404).json({ error: "SERVER_CONTEXT_REQUIRED" });', 'if (!serverDescriptor) { res.status(404).json({ error: "SERVER_CONTEXT_REQUIRED" }); return; }', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/api-server/src
          git commit -m 'fix: complete primary migration type errors'
          git push
